# Classic Mail MCP · Nginx instalado direto no host (Ubuntu), na frente do container do Portainer.
#
# Instale em /etc/nginx/sites-available/classic-mail.mcp.mambootech.com e ative com um link em sites-enabled.
# Este arquivo é a versão ANTES do certificado. Rode:
#   sudo certbot --nginx -d classic-mail.mcp.mambootech.com
# e o certbot acrescenta o bloco 443 com o certificado e o redirecionamento HTTP → HTTPS.
# Se preferir manter o controle manual, veja o bloco comentado no final.
#
# O stack publica o container na porta 8088 do host (BIND_PORT do stack no Portainer). Se mudar lá, mude aqui.

# Streamable HTTP + OAuth: sem cache, sem buffering, cabeçalhos intactos, timeout de leitura > 125 s.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name classic-mail.mcp.mambootech.com;

    # O corpo máximo aceito pelo servidor é 12 MiB (anexos em rascunhos/envios).
    client_max_body_size 13m;

    # Nada aqui deve ir para logs de terceiros; o access log padrão não registra cabeçalhos.
    access_log /var/log/nginx/classic-mail.access.log;
    error_log  /var/log/nginx/classic-mail.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Authorization, Cookie e WWW-Authenticate passam intactos por padrão; não intercepte erros
        # (o 401 do servidor carrega o ponteiro resource_metadata que o Claude precisa ler).
        proxy_intercept_errors off;
        proxy_pass_header WWW-Authenticate;

        # Respostas podem levar até 125 s (busca em caixas grandes, SMTP lento).
        proxy_connect_timeout 10s;
        proxy_send_timeout    135s;
        proxy_read_timeout    135s;

        # Streamable HTTP: entregue cada chunk assim que chegar e nunca cacheie.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}

