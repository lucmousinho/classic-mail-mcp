# Classic Mail MCP · stack para Portainer (Docker standalone) publicando uma porta local.
# Use este arquivo quando o TLS é terminado por Nginx Proxy Manager, Caddy, Nginx ou Cloudflare Tunnel
# rodando no mesmo host. A porta fica presa em 127.0.0.1: só o proxy do host alcança o serviço.
#
# Variáveis do stack (aba "Environment variables" do Portainer):
#   IMAGE          ghcr.io/SEU-USUARIO/classic-mail-mcp:latest
#   BASE_URL       https://mail-mcp.seudominio.com   (origem HTTPS pública, sem barra final)
#   CONFIG_FILE    /opt/classic-mail/config.json     (gerado pelo scripts/setup.py --mode mailbox)
#   AUTH_MODE      mailbox (multiusuário) | oauth (um operador, login Google)
#   ACCESS_MODE    read-only | read-write
#   BIND_PORT      8080                              (porta local que o proxy vai usar)
#
# Se o proxy roda em outro container (ex.: Nginx Proxy Manager), prefira trocar o bloco "ports"
# por uma rede compartilhada com ele, como no stack-traefik.yml, e aponte o NPM para
# http://classic-mail-mcp:8080. Guia completo: docs/portainer.md
services:
  classic-mail:
    image: ${IMAGE:-ghcr.io/SEU-USUARIO/classic-mail-mcp:latest}
    container_name: classic-mail-mcp
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m, mode=1777]
    ports:
      - '127.0.0.1:${BIND_PORT:-8080}:8080'
    volumes:
      - ${CONFIG_FILE:-/opt/classic-mail/config.json}:/run/secrets/mail-config.json:ro
      - classic_mail_data:/data
    environment:
      TRANSPORT: http
      AUTH_MODE: ${AUTH_MODE:-mailbox}
      ACCESS_MODE: ${ACCESS_MODE:-read-only}
      BASE_URL: ${BASE_URL}
      APP_CONFIG_FILE: /run/secrets/mail-config.json
      HOST: 0.0.0.0
      PORT: 8080
      STORAGE: sqlite
      SQLITE_PATH: /data/mail.sqlite
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s

volumes:
  classic_mail_data:
